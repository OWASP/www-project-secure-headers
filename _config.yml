title: OWASP Secure Headers Project
description: Provides technical information about HTTP security headers.

theme: jekyll-theme-dinky

permalink: /:title/

exclude:
  - README.md
  - CONTRIBUTING.md
  - CODE_OF_CONDUCT.md
  - SECURITY.md
  - CLAUDE.md
  - LICENSE.txt
  - subprojects/
  - archives/
  - .github/
  - .vscode/
  - ci/
  - "*.py"
  - "*.json"
  - "*.yaml"
  - "*.txt"
  - "*.code-workspace"

plugins:
  - jekyll-include-cache