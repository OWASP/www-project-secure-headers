title: OWASP Secure Headers Project
description: Provides technical information about HTTP security headers.
baseurl: /www-project-secure-headers

remote_theme: just-the-docs/just-the-docs
url: https://righettod.github.io

permalink: /:title/

defaults:
  - scope:
      path: "mainsite"
    values:
      layout: "default"

include:
  - mainsite/

exclude:
  - subprojects/
  - archives/
  - ci/
  - logo/
  - README.md
  - CONTRIBUTING.md
  - CODE_OF_CONDUCT.md
  - SECURITY.md
  - CLAUDE.md
  - LICENSE.txt
  - requirements.txt
  - pad-md-tables.py
  - markdown-link-check_config.json
  - project.code-workspace
  - project.owasp.yaml

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache